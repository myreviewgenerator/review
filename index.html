const heroText={
  en:{title:"Leave us a quick review!",sub:"It takes less than 30 seconds, and your feedback means a lot to us. 🙏",experience:"5 stars selected by default — change it to match your actual experience."},
  hi:{title:"अपना छोटा सा रिव्यू शेयर करें!",sub:"30 सेकंड से भी कम समय लगेगा—आपका feedback हमारे लिए बहुत मायने रखता है। 🙏",experience:"5 स्टार पहले से चुने हैं — अपने वास्तविक अनुभव के अनुसार बदलें:"},
  bn:{title:"একটা ছোট্ট রিভিউ দিন!",sub:"৩০ সেকেন্ডেরও কম সময় লাগবে—আপনার feedback আমাদের জন্য সত্যিই অনেক মূল্যবান। 🙏",experience:"৫ স্টার আগে থেকেই বেছে নেওয়া আছে — আপনার বাস্তব অভিজ্ঞতা অনুযায়ী বদলান:"}
};
const GOOGLE_REVIEW_URL="https://search.google.com/local/writereview?placeid=ChIJfeABDW1B5DkRAxvyb9j6Cyk";
let currentLang="en",selectedCategoryId="",recentKeys=[],generatedCount=0;
const $=id=>document.getElementById(id);
function renderCategories(){
  try{prepareGenerationContext(currentCategory);}catch(e){}

 const c=$("treatment-tags");
 c.innerHTML="";
 reviewMeta[currentLang].treatments.forEach(item=>{
  const d=document.createElement("button");
  d.type="button";
  d.className="tag";
  d.dataset.id=item.id;
  d.textContent=item.name;
  d.setAttribute("aria-pressed",item.id===selectedCategoryId?"true":"false");
  d.addEventListener("click",()=>selectCategory(item.id));
  c.appendChild(d);
 });
 updateCategorySelection();
}
function updateCategorySelection(){
 document.querySelectorAll(".tag").forEach(t=>{
  const selected=t.dataset.id===selectedCategoryId;
  t.classList.toggle("selected",selected);
  t.setAttribute("aria-pressed",selected?"true":"false");
 });
}
function setLanguage(lang){
 currentLang=lang;
 document.querySelectorAll(".lang-btn").forEach(b=>b.classList.toggle("active",b.dataset.lang===lang));
 $("ui-hero-title").textContent=heroText[lang].title;
 $("ui-hero-sub").textContent=heroText[lang].sub;
 $("rating-prompt").textContent=heroText[lang].experience;
 $("ui-subtitle").textContent=reviewMeta[lang].subtitle;
 $("ui-notice").textContent=reviewMeta[lang].notice;
 if(!reviewMeta[lang].treatments.some(item=>item.id===selectedCategoryId)){
  selectedCategoryId=reviewMeta[lang].treatments[0].id;
 }
 renderCategories();
 updateCounter();
 generateReview();
}
function selectCategory(id){
 selectedCategoryId=id;
 updateCategorySelection();
 generateReview();
}
function pick(arr){
 return arr[Math.floor(Math.random()*arr.length)];
}
function shuffle(arr){
 const a=[...arr];
 for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}
 return a;
}
function generateReview(){
 const bank=knowledgeBank[currentLang][selectedCategoryId];
 if(!bank)return;
 let review="",key="",tries=0;
 do{
   // Randomize component order choices and choose a fresh combination.
   const parts=[pick(bank.o),pick(bank.b),pick(bank.r),pick(bank.c)];
   review=parts.join(" ");
   key=currentLang+"|"+selectedCategoryId+"|"+review;
   tries++;
 }while(recentKeys.includes(key)&&tries<500);

 recentKeys.push(key);
 if(recentKeys.length>500)recentKeys.shift();
 $("reviewBox").value=review;
 generatedCount++;
 updateCounter();
}
function generateDifferentSameCategory(){
 // Category remains locked; only the review combination changes.
 if(!selectedCategoryId){
   const first=reviewMeta[currentLang].treatments[0];
   selectedCategoryId=first.id;
   document.querySelectorAll(".tag").forEach(t=>t.classList.toggle("selected",t.dataset.id===first.id));
 }
 generateReview();
}
function autoSelectRandomReview(){
 const list=reviewMeta[currentLang].treatments;
 let item=pick(list),tries=0;
 while(list.length>1&&item.id===selectedCategoryId&&tries<30){item=pick(list);tries++}
 selectedCategoryId=item.id;
 updateCategorySelection();
 generateReview();
}
function updateCounter(){
 const combinationsPerCategory=1296;
 const total=reviewMeta[currentLang].treatments.length*combinationsPerCategory;
 $("counter").textContent=total+" possible combinations in this language • "+reviewMeta[currentLang].treatments.length+" categories";
}
let selectedRating=5;

function setRating(rating){
  selectedRating=rating;
  document.querySelectorAll(".star").forEach(star=>{
    const value=Number(star.dataset.rating);
    star.classList.toggle("active",value<=rating);
    star.classList.toggle("inactive",value>rating);
    star.setAttribute("aria-checked",value===rating?"true":"false");
  });
  $("rating-prompt").textContent=heroText[currentLang].experience;
}

document.querySelectorAll(".star").forEach(star=>{
  star.addEventListener("click",()=>setRating(Number(star.dataset.rating)));
});

async function copyReview(){
  const text=$("reviewBox").value.trim();
  if(!text){ alert("Please generate a review first."); return; }

  try{
    await navigator.clipboard.writeText(text);
  }catch(e){
    const box=$("reviewBox");
    box.focus();
    box.select();
    document.execCommand("copy");
  }

  const url=GOOGLE_REVIEW_URL;
  const opened=window.open(url,"_blank","noopener,noreferrer");

  if(!opened){
    alert("Review copied. Please allow pop-ups to open the Google review page.");
  }
}
document.querySelectorAll(".lang-btn").forEach(b=>b.addEventListener("click",()=>setLanguage(b.dataset.lang)));
$("differentBtn").addEventListener("click",generateDifferentSameCategory);
$("anotherBtn").addEventListener("click",autoSelectRandomReview);
$("copyBtn").addEventListener("click",copyReview);
window.addEventListener("DOMContentLoaded",()=>setLanguage("en"));

</script>
