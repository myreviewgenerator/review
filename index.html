const GOOGLE_REVIEW_URL="https://search.google.com/local/writereview?placeid=ChIJfeABDW1B5DkRAxvyb9j6Cyk";
let currentLang="en",selectedCategoryId="",recentKeys=[],generatedCount=0;
const $=id=>document.getElementById(id);
function setLanguage(lang){
 currentLang=lang;
 document.querySelectorAll(".lang-btn").forEach(b=>b.classList.toggle("active",b.dataset.lang===lang));
 $("ui-subtitle").textContent=reviewMeta[lang].subtitle;
 $("ui-notice").textContent=reviewMeta[lang].notice;
 const c=$("treatment-tags");c.innerHTML="";
 reviewMeta[lang].treatments.forEach(item=>{
  const d=document.createElement("div");d.className="tag";d.dataset.id=item.id;d.textContent=item.name;
  d.addEventListener("click",()=>selectCategory(item.id,d));
  c.appendChild(d);
 });
 updateCounter();
 autoSelectRandomReview(true);
}
function selectCategory(id,element){
 selectedCategoryId=id;
 document.querySelectorAll(".tag").forEach(t=>t.classList.toggle("selected",t.dataset.id===id));
 generateReview();
}
function pick(arr){
 return arr[Math.floor(Math.random()*arr.length)];
}
function shuffle(arr){
 const a=[...arr];
 for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}
 return a;
}
function generateReview(){
 const bank=knowledgeBank[currentLang][selectedCategoryId];
 if(!bank)return;
 let review="",key="",tries=0;
 do{
   // Randomize component order choices and choose a fresh combination.
   const parts=[pick(bank.o),pick(bank.b),pick(bank.r),pick(bank.c)];
   review=parts.join(" ");
   key=currentLang+"|"+selectedCategoryId+"|"+review;
   tries++;
 }while(recentKeys.includes(key)&&tries<100);

 recentKeys.push(key);
 if(recentKeys.length>100)recentKeys.shift();
 $("reviewBox").value=review;
 generatedCount++;
 updateCounter();
}
function generateDifferentSameCategory(){
 // Category remains locked; only the review combination changes.
 if(!selectedCategoryId){
   const first=reviewMeta[currentLang].treatments[0];
   selectedCategoryId=first.id;
   document.querySelectorAll(".tag").forEach(t=>t.classList.toggle("selected",t.dataset.id===first.id));
 }
 generateReview();
}
function autoSelectRandomReview(){
 const list=reviewMeta[currentLang].treatments;
 let item=pick(list),tries=0;
 while(list.length>1&&item.id===selectedCategoryId&&tries<30){item=pick(list);tries++}
 selectedCategoryId=item.id;
 document.querySelectorAll(".tag").forEach(t=>t.classList.toggle("selected",t.dataset.id===item.id));
 generateReview();
}
function updateCounter(){
 const combinationsPerCategory=81;
 const total=reviewMeta[currentLang].treatments.length*combinationsPerCategory;
 $("counter").textContent=total+" possible combinations in this language • "+reviewMeta[currentLang].treatments.length+" categories";
}
async function copyReview(){
 const text=$("reviewBox").value.trim();
 if(!text){alert(currentLang==="bn"?"প্রথমে একটি category নির্বাচন করুন।":currentLang==="hi"?"पहले एक category चुनें।":"Please select a treatment category first.");return}
 try{await navigator.clipboard.writeText(text)}catch(e){$("reviewBox").select();document.execCommand("copy")}
 const old=$("copyBtn").textContent;$("copyBtn").textContent="✓ Copied";setTimeout(()=>$("copyBtn").textContent=old,1400);
 if(confirm(currentLang==="bn"?"Google review page খুলবেন?":currentLang==="hi"?"Google review page खोलें?":"Open the Google review page?"))window.open(GOOGLE_REVIEW_URL,"_blank","noopener,noreferrer");
}
document.querySelectorAll(".lang-btn").forEach(b=>b.addEventListener("click",()=>setLanguage(b.dataset.lang)));
$("differentBtn").addEventListener("click",generateDifferentSameCategory);
$("anotherBtn").addEventListener("click",autoSelectRandomReview);
$("copyBtn").addEventListener("click",copyReview);
window.addEventListener("load",()=>setLanguage("en"));

</script>
